<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="left-image-div">
        <div class="logo-area">
            <img src="/logo.png" id="odin-logo">
            <p>ODIN</p>
        </div>
    </div>

    <div class="right-form-div">
        <div class="message-container">
            <p>This is not a real online service! You know you need something like this in your life to help you realize
                your deepest dreams. Sign up <span style="font-style: italic;">now</span> to get started.</p>
            <p>You <span style="font-style: italic;">know</span> you want to.</p>
        </div>

        <div class="form-container">
            <p>Let's do this!</p>
            <form>
                <div class="input-group">
                    <label for="first-name">first name</label>
                    <input type="text" id="first-name" name="first-name">
                </div>

                <div class="input-group">
                    <label for="last-name">last name</label>
                    <input type="text" id="last-name" name="last-name">
                </div>

                <div class="input-group">
                    <label for="email">email</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="input-group">
                    <label for="phone-number">phone number</label>
                    <input type="tel" id="phone-number" name="phone-number">
                </div>

                <div class="input-group">
                    <label for="password">password</label>
                    <input type="password" id="password" name="password">
                </div>

                <div class="input-group">
                    <label for="confirm-password">confirm password</label>
                    <input type="password" id="confirm-password" name="confirm-password">
                </div>
            </form>
        </div>

        <div class="action-container">
            <button type="submit">Create Account</button>
            <p>Already have an account? <a href="/">Log in</a></p>
        </div>
    </div>

</body>

</html>
